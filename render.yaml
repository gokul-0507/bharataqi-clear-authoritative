services:
  - type: web
    name: cpcb-aqi-dashboard
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AQICN_TOKEN
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
